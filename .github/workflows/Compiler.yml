name: Compilar Instalador

on: [push]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        
         # 1. Instalar o Python
      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12' 

      # 2. Instalar dependências (incluindo o PyInstaller)
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          # Se seu projeto tiver um requirements.txt, instale também:
          # pip install -r requirements.txt
          
      - name: Compilar App (PyInstaller)
        run: pyinstaller --clean 

      - name: Instalar Inno Setup
        run: choco install innosetup -y
      
      - name: Compilar Script
        run: iscc ExtratorDataSul_Setup.iss

      - name: Upload do Instalador
        uses: actions/upload-artifact@v4
        with:
          name: ExtratorDataSul
          path: Output/ExtratorDataSul.exe
