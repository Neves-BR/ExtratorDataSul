name: Compilar Instalador

on: [push]

jobs:
  build:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        
         # 1. Instalar o Python
      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12' 

      # 2. Instalar dependências (incluindo o PyInstaller)
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          # Se seu projeto tiver um requirements.txt, instale também:
          # pip install -r requirements.txt
          
      - name: Compilar App (PyInstaller)
        run: pyinstaller --clean --onefile --name ExtratorDataSul extrator_pywebview.py

      - name: Instalar Inno Setup
        run: choco install innosetup -y
        
      - name: Preparar pastas para o Inno Setup
        run: |
          mkdir dist\ExtratorDataSul
          copy dist\ExtratorDataSul.exe dist\ExtratorDataSul\
          
      - name: Debugar arquivos
        run: |
          echo "Conteúdo da pasta dist:"
          dir dist
          echo "Conteúdo da pasta dist\ExtratorDataSul:"
          dir dist\ExtratorDataSul || echo "Esta pasta não existe"
      
      - name: Compilar Script
        run: iscc ExtratorDataSul_Setup.iss
        
      - name: Listar arquivos na pasta Output
        run: dir Output\

      - name: Upload do Instalador
        uses: actions/upload-artifact@v4
        with:
          name: ExtratorDataSul
          path: Output/*.exe
