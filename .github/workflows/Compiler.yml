name: Compilar Instalador

permissions:
  contents: write
on:
  push:
    tags:
      - 'v*'  # O workflow só roda se você enviar uma tag como 'v1.0.1'
jobs:
  build:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Ler Versão
        id: get_version
        shell: powershell
        run: |
          $content = Get-Content -Path "version.py" -Raw
          if ($content -match "VERSION\s*=\s*['`"]([^'`"]+)['`"]") {
              $ver = $matches[1]
              echo "VERSION=$ver" >> $env:GITHUB_ENV
          } else {
              echo "VERSION=0.0.0" >> $env:GITHUB_ENV
          }
      
      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12' 

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          # Se seu projeto tiver um requirements.txt, instale também:
          # pip install -r requirements.txt
          
      - name: Compilar App (PyInstaller)
        run: pyinstaller --clean --onefile --name ExtratorDataSul extrator_pywebview.py

      - name: Instalar Inno Setup
        run: choco install innosetup -y
        
      - name: Preparar pastas para o Inno Setup
        run: |
          mkdir dist\ExtratorDataSul
          copy dist\ExtratorDataSul.exe dist\ExtratorDataSul\
          
      - name: Debugar arquivos
        run: |
          echo "Conteúdo da pasta dist:"
          dir dist
          echo "Conteúdo da pasta dist\ExtratorDataSul:"
          dir dist\ExtratorDataSul || echo "Esta pasta não existe"
      
      - name: Compilar Script
        run: iscc ExtratorDataSul_Setup.iss
        
      - name: Listar arquivos na pasta Output
        run: dir Output\

      - name: Upload do Instalador
        uses: actions/upload-artifact@v4
        with:
          name: ExtratorDataSul
          path: Output/*.exe
          
      - name: Criar Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          name: Versão ${{ env.VERSION }}
          files: Output/ExtratorDataSul_Setup.exe
          draft: false
          prerelease: false
